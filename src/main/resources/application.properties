spring.application.name=schoolhouse

server.port=3001

spring.datasource.url=jdbc:h2:mem:schoolhouse;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

app.library.fine-per-day=0.50
app.library.default-loan-days=14
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173

# JWT settings
app.jwt.secret=base64:REPLACE_WITH_BASE64_SECRET
app.jwt.expiration-ms=2592000000
    